plans:

  - name: Public (Free)
    description: >
      Free, unauthenticated batch identifier conversion. Submit one or more
      identifiers of any supported type and receive equivalents in all other
      supported types.
    free: true
    features:
      - PMCID to PMID, DOI, Manuscript ID conversion
      - PMID to PMCID, DOI conversion
      - DOI to PMCID, PMID conversion
      - Batch requests (multiple identifiers per call)
      - JSON and XML response formats
