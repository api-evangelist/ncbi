- name: PMC Open Access API (OA Service)
  description: >
    The PubMed Central Open Access API retrieves citation data, licensing details, and FTP download locations
    for Open Access articles in the PMC archive. Queries accept a PMC identifier and return structured
    XML with article metadata and links to full-text files in formats such as PDF and XML.
  image: https://pmc.ncbi.nlm.nih.gov/favicon.ico
  humanURL: https://pmc.ncbi.nlm.nih.gov/tools/oa-service/
  baseURL: https://www.ncbi.nlm.nih.gov/pmc/utils/oa/oa.fcgi
