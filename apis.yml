- name: PMC OAI-PMH Service
  description: >
    The PMC OAI-PMH (Open Archives Initiative Protocol for Metadata Harvesting) service allows bulk harvesting
    of metadata for all items in the PMC archive and full-text content for articles with Creative Commons
    licenses. It follows the OAI-PMH 2.0 protocol standard and is suited for building downstream literature
    indexes and research data pipelines.
  image: https://pmc.ncbi.nlm.nih.gov/favicon.ico
  humanURL: https://pmc.ncbi.nlm.nih.gov/tools/oai/
  baseURL: https://pmc.ncbi.nlm.nih.gov/api/oai/v1/mh/
