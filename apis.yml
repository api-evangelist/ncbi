- name: NCBI BLAST URL API
  description: >
    The BLAST (Basic Local Alignment Search Tool) URL API allows developers to submit nucleotide and protein
    sequence homology searches via HTTPS, poll for job status, and retrieve results in multiple formats
    including XML, JSON, and tabular output. Jobs can be processed at NCBI or at cloud service providers.
    No API key is required, though responsible use guidelines apply.
  image: https://www.ncbi.nlm.nih.gov/favicon.ico
  humanURL: https://blast.ncbi.nlm.nih.gov/doc/blast-help/developerinfo.html
  baseURL: https://blast.ncbi.nlm.nih.gov/blast/Blast.cgi
  tags:
  - BLAST
  - Sequence Alignment
  - Homology
  - Genomics
  properties:
