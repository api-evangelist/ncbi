- name: PMC ID Converter API
  description: >
    The PMC ID Converter API translates between PubMed Central identifiers (PMCID), PubMed identifiers
    (PMID), Manuscript IDs, and Digital Object Identifiers (DOI). Batch conversion is supported, making
    it straightforward to harmonize identifiers across literature databases.
  image: https://pmc.ncbi.nlm.nih.gov/favicon.ico
  humanURL: https://pmc.ncbi.nlm.nih.gov/tools/id-converter-api/
  baseURL: https://pmc.ncbi.nlm.nih.gov/tools/idconv/api/v1/articles/
