- name: PubChem PUG REST API
  description: >
    The PubChem Power User Gateway (PUG) REST API provides programmatic access to PubChem's chemical compound,
    substance, and bioassay data. Developers can retrieve compound properties, structures, synonyms, and
    cross-references by name, SMILES, InChI, CID, SID, or AID. The API supports structure search operations
    and integrates with E-utilities for cross-database queries. Responses are available in JSON, XML,
    SDF, and other formats.
  image: https://pubchem.ncbi.nlm.nih.gov/favicon.ico
  humanURL: https://pubchem.ncbi.nlm.nih.gov/docs/pug-rest
  baseURL: https://pubchem.ncbi.nlm.nih.gov/rest/pug
  tags:
  - Chemistry
  - Compounds
  - PubChem
  - Structures
  - Bioassay
